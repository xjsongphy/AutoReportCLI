[workspace]
members = [
    "autoreport-rs/cli",
    "autoreport-rs/core",
    "autoreport-rs/async-utils",
    "autoreport-rs/execpolicy",
    "autoreport-rs/protocol",
    "autoreport-rs/rollout",
    "autoreport-rs/runtime",
    "autoreport-rs/shell-command",
    "autoreport-rs/tui",
    "autoreport-rs/tools",
    "autoreport-rs/utils/absolute-path",
    "autoreport-rs/utils/path-uri",
    "autoreport-rs/sandboxing",
    "autoreport-rs/process-hardening",
    "autoreport-rs/install-context",
    "autoreport-rs/utils/home-dir",
    "autoreport-rs/utils/rustls-provider",
    "autoreport-rs/network-proxy",
    "autoreport-rs/linux-sandbox",
    "autoreport-rs/bwrap",
    "autoreport-rs/utils/pty",
    "autoreport-rs/utils/string",
    "autoreport-rs/otel",
    "autoreport-rs/windows-sandbox",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chardetng = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
diffy = "0.4"
derive_more = { version = "2", features = ["is_variant"] }
dirs = "5"
dunce = "1"
encoding_rs = "0.8"
env_logger = "0.11"
futures = "0.3"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
ignore = "0.4"
libc = "0.2"
once_cell = "1"
landlock = "0.4.4"
log = "0.4"
nucleo = "0.5"
pulldown-cmark = { version = "0.12", default-features = false }
ratatui = { version = "0.29", features = ["unstable-widget-ref", "unstable-rendered-line-info"] }
regex = "1"
regex-lite = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shlex = "1"
# Starlark interpreter for the exec-policy rule language (vendored codex
# execpolicy crate uses the same version + `default-features = false` to keep
# the build slim — matches codex-rs/Cargo.toml).
starlark = { version = "0.14.2", default-features = false }
multimap = "0.10"
pretty_assertions = "1"
tempfile = "3"
toml = "0.8"
sha2 = "0.10"
supports-color = "3.0.2"
seccompiler = "0.5.0"
shellexpand = "3"
strum = "0.27"
strum_macros = "0.28"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
textwrap = "0.16"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tree-sitter = "0.24"
tree-sitter-bash = "0.23"
tracing = "0.1"
ts-rs = { version = "11", features = ["serde-json-impl", "no-serde-warnings"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
url = "2"
urlencoding = "2.1"
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
which = "6"

[profile.release]
opt-level = 3
lto = "thin"

[patch.crates-io]
# Rama 0.3.0-alpha.4 is the exact version used by Codex's network proxy. Its
# HAR parser needs this one-line `String -> Box<str>` compatibility fix for
# the current Rust toolchain.
rama-http = { path = "third_party/rama-http" }
