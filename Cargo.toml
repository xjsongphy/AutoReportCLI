[workspace]
members = [
    "autoreport-rs/vendor/codex/app-server",
    "autoreport-rs/vendor/codex/app-server-protocol",
    "autoreport-rs/vendor/codex/app-server-transport",
    "autoreport-rs/vendor/codex/codex-protocol",
    "autoreport-rs/vendor/codex/state",
    "autoreport-rs/vendor/codex/file-system",
    "autoreport-rs/vendor/codex/file-search",
    "autoreport-rs/vendor/codex/rollout",
    "autoreport-rs/vendor/codex/thread-store",
    "autoreport-rs/vendor/codex/git-utils",
    "autoreport-rs/vendor/codex/code-mode-protocol",
    "autoreport-rs/vendor/codex/skills",
    "autoreport-rs/vendor/codex/cargo-bin",
    "autoreport-rs/utils/output-truncation",
    "autoreport-rs/utils/path-utils",
    "autoreport-rs/utils/stream-parser",
    "autoreport-rs/cli",
    "autoreport-rs/core",
    "autoreport-rs/async-utils",
    "autoreport-rs/extension-items",
    "autoreport-rs/experimental-api-macros",
    "autoreport-rs/execpolicy",
    "autoreport-rs/protocol",
    "autoreport-rs/rollout",
    "autoreport-rs/runtime",
    "autoreport-rs/shell-command",
    "autoreport-rs/tui",
    "autoreport-rs/tools",
    "autoreport-rs/utils/absolute-path",
    "autoreport-rs/utils/cache",
    "autoreport-rs/utils/image",
    "autoreport-rs/utils/path-uri",
    "autoreport-rs/terminal-detection",
    "autoreport-rs/sandboxing",
    "autoreport-rs/process-hardening",
    "autoreport-rs/install-context",
    "autoreport-rs/utils/home-dir",
    "autoreport-rs/utils/rustls-provider",
    "autoreport-rs/network-proxy",
    "autoreport-rs/linux-sandbox",
    "autoreport-rs/bwrap",
    "autoreport-rs/utils/pty",
    "autoreport-rs/utils/string",
    "autoreport-rs/uds",
    "autoreport-rs/otel",
    "autoreport-rs/windows-sandbox",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
age = "0.11"
arc-swap = "1.9"
clatter = { version = "2.2", default-features = false, features = ["alloc", "getrandom", "use-25519", "use-aes-gcm", "use-rust-crypto-ml-kem", "use-sha"] }
autoreport-utils-absolute-path = { path = "autoreport-rs/utils/absolute-path" }
autoreport-utils-cache = { path = "autoreport-rs/utils/cache" }
autoreport-utils-image = { path = "autoreport-rs/utils/image" }
autoreport-async-utils = { path = "autoreport-rs/async-utils" }
autoreport-execpolicy = { path = "autoreport-rs/execpolicy" }
autoreport-extension-items = { path = "autoreport-rs/extension-items" }
autoreport-experimental-api-macros = { path = "autoreport-rs/experimental-api-macros" }
autoreport-shell-command = { path = "autoreport-rs/shell-command" }
autoreport-network-proxy = { path = "autoreport-rs/network-proxy" }
autoreport-sandboxing = { path = "autoreport-rs/sandboxing" }
autoreport-install-context = { path = "autoreport-rs/install-context" }
autoreport-process-hardening = { path = "autoreport-rs/process-hardening" }
autoreport-windows-sandbox = { path = "autoreport-rs/windows-sandbox" }
autoreport-utils-path-uri = { path = "autoreport-rs/utils/path-uri" }
autoreport-utils-string = { path = "autoreport-rs/utils/string" }
autoreport-utils-pty = { path = "autoreport-rs/utils/pty" }
autoreport-utils-home-dir = { path = "autoreport-rs/utils/home-dir" }
autoreport-codex-protocol = { path = "autoreport-rs/vendor/codex/codex-protocol" }
autoreport-file-system = { path = "autoreport-rs/vendor/codex/file-system" }
autoreport-file-search = { path = "autoreport-rs/vendor/codex/file-search" }
autoreport-codex-rollout = { path = "autoreport-rs/vendor/codex/rollout" }
autoreport-thread-store = { path = "autoreport-rs/vendor/codex/thread-store" }
autoreport-git-utils = { path = "autoreport-rs/vendor/codex/git-utils" }
autoreport-code-mode-protocol = { path = "autoreport-rs/vendor/codex/code-mode-protocol" }
autoreport-skills = { path = "autoreport-rs/vendor/codex/skills" }
autoreport-utils-cargo-bin = { path = "autoreport-rs/vendor/codex/cargo-bin" }
autoreport-utils-output-truncation = { path = "autoreport-rs/utils/output-truncation" }
autoreport-utils-path = { path = "autoreport-rs/utils/path-utils" }
autoreport-utils-stream-parser = { path = "autoreport-rs/utils/stream-parser" }
autoreport-state = { path = "autoreport-rs/vendor/codex/state" }
autoreport-utils-rustls-provider = { path = "autoreport-rs/utils/rustls-provider" }
autoreport-app-server-protocol = { path = "autoreport-rs/vendor/codex/app-server-protocol" }
autoreport-app-server = { path = "autoreport-rs/vendor/codex/app-server" }
autoreport-protocol = { path = "autoreport-rs/protocol" }
autoreport-app-server-transport = { path = "autoreport-rs/vendor/codex/app-server-transport" }
autoreport-otel = { path = "autoreport-rs/otel" }
autoreport-uds = { path = "autoreport-rs/uds" }
autoreport-terminal-detection = { path = "autoreport-rs/terminal-detection" }
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
assert_cmd = "2"
assert_matches = "1.5.0"
async-io = "2.6.0"
async-channel = "2.3"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"] }
base64 = "0.22"
constant_time_eq = "0.3"
crypto_box = { version = "0.9", features = ["seal"] }
crossbeam-channel = "0.5"
ctor = "0.6.3"
bytes = "1"
chardetng = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
diffy = "0.4"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
keyring = { version = "3.6", default-features = false, features = ["crypto-rust"] }
icu_decimal = "2.1"
icu_locale_core = "2.1"
icu_provider = { version = "2.1", features = ["sync"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
lru = "0.12"
maplit = "1.0.2"
mime_guess = "2.0"
quick-xml = { version = "0.41", features = ["serialize"] }
inventory = "0.3"
rmcp = { version = "1.8", default-features = false }
sha1 = "0.10"
similar = "2.7.0"
serial_test = "3.2.0"
scopeguard = "1.2.0"
sys-locale = "0.3"
wildmatch = "2"
walkdir = "2.5"
derive_more = { version = "2", features = ["is_variant"] }
dirs = "5"
dunce = "1"
encoding_rs = "0.8"
env_logger = "0.11"
futures = "0.3"
futures-util = "0.3"
globset = "0.4"
gix = { version = "0.81", default-features = false, features = ["sha1"] }
gethostname = "0.5"
indexmap = "2.12"
libsqlite3-sys = { version = "0.37", default-features = false }
hex = "0.4"
hmac = "0.12.1"
http = "1.3.1"
ignore = "0.4"
include_dir = "0.7"
libc = "0.2"
once_cell = "1"
landlock = "0.4.4"
log = "0.4"
nucleo = { git = "https://github.com/helix-editor/nucleo.git", rev = "4253de9faabb4e5c6d81d946a5e35a90f87347ee" }
os_info = "3"
pulldown-cmark = { version = "0.12", default-features = false }
ratatui = { version = "0.29", features = ["unstable-widget-ref", "unstable-rendered-line-info"] }
runfiles = "0.3.0"
regex = "1"
regex-lite = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "stream", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shlex = "1"
# Starlark interpreter for the exec-policy rule language (vendored codex
# execpolicy crate uses the same version + `default-features = false` to keep
# the build slim — matches codex-rs/Cargo.toml).
starlark = { version = "0.14.2", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "macros", "migrate", "runtime-tokio", "tls-rustls", "sqlite-bundled", "time", "uuid"] }
tracing-subscriber = "0.3"
multimap = "0.10"
pretty_assertions = "1"
rcgen = { version = "0.14.7", default-features = false, features = ["aws_lc_rs", "pem"] }
serde_ignored = "0.1"
serde_path_to_error = "0.1"
tempfile = "3"
test-case = "3.3.1"
toml = "0.8"
jsonwebtoken = "9.3"
eventsource-stream = "0.2"
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
rand = "0.9"
rustls-native-certs = "0.8"
rustls-pki-types = "1.14"
system-configuration = "0.7"
tokio-rustls = "0.26"
tracing-opentelemetry = "0.32"
zstd = "0.13"
owo-colors = { version = "4", features = ["supports-colors"] }
sha2 = "0.10"
supports-color = "3.0.2"
seccompiler = "0.5.0"
proc-macro2 = "1"
quote = "1"
shellexpand = "3"
syn = { version = "2", features = ["full", "extra-traits"] }
strum = "0.27"
strum_macros = "0.28"
serde_with = { version = "3", features = ["macros", "base64"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
textwrap = "0.16"
thiserror = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "local-offset"] }
tiny_http = "0.12"
webbrowser = "1.0"
tokio = { version = "1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "test-util",
    "time",
    "tracing",
] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.28", features = ["proxy", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-test = "0.4"
wiremock = "0.6"
toml_edit = "0.22"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tungstenite = { version = "0.27", features = ["deflate", "proxy"] }
prost = "0.14"
dns-lookup = "2"
tonic-prost = "0.14"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tracing = "0.1"
ts-rs = { version = "11", features = ["uuid-impl", "serde-json-impl", "no-serde-warnings"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
url = "2"
uds_windows = "1.1.0"
urlencoding = "2.1"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
unicode-width = "0.2"
which = "6"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
# Rama 0.3.0-alpha.4 is the exact version used by Codex's network proxy. Its
# HAR parser needs this one-line `String -> Box<str>` compatibility fix for
# the current Rust toolchain.
rama-http = { path = "third_party/rama-http" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
