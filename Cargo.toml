[package]
name = "autoreport-cli"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "AutoReportCLI — a codex-style multi-agent CLI for automated physics experiment report writing"
license = "MIT"
default-run = "autoreport"

[[bin]]
name = "autoreport"
path = "src/main.rs"

[lib]
name = "autoreport_cli"
path = "src/lib.rs"

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# http + streaming
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# errors / cli
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }

# terminal UI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
pulldown-cmark = { version = "0.12", default-features = false }
# codex display stack (vendored from codex-rs/tui)
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
textwrap = "0.16"
url = "2"
urlencoding = "2.1"
regex-lite = "0.1"
tracing = "0.1"
# fuzzy @ file search — same engine codex uses (nucleo) + gitignore-aware walker
nucleo = "0.5"
ignore = "0.4"
# unified diff rendering for apply_patch/edit (codex uses diffy)
diffy = "0.4"

# codex cross-system sandbox (vendored from codex-rs/{protocol,sandboxing,utils}).
# These derive crates are required because the vendored source files are copied
# byte-for-byte (JsonSchema / TS / strum derives on the policy types).
schemars = "0.8"
ts-rs = { version = "11", features = ["serde-json-impl", "no-serde-warnings"] }
strum = "0.27"
strum_macros = "0.28"
globset = "0.4"
base64 = "0.22"
dunce = "1"
# Exec output encoding detection (vendored codex-rs/protocol/src/exec_output.rs).
chardetng = "0.1"
encoding_rs = "0.8"

# misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
dirs = "5"
shellexpand = "3"
log = "0.4"
env_logger = "0.11"
which = "6"
libc = "0.2"
tree-sitter = "0.24"
tree-sitter-bash = "0.23"

# Windows named-pipe client for the codex IDE-context IPC (`/ide`).
# Vendored verbatim from codex-rs/tui; keep the same version + feature set.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
# Required by the vendored codex protocol/sandbox test modules.
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto = "thin"
