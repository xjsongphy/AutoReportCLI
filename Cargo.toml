[package]
name = "autoreport-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "AutoReportCLI — a codex-style multi-agent CLI for automated physics experiment report writing"
license = "MIT"
default-run = "autoreport"

[[bin]]
name = "autoreport"
path = "src/main.rs"

[lib]
name = "autoreport_cli"
path = "src/lib.rs"

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# http + streaming
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# errors / cli
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }

# terminal UI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
pulldown-cmark = { version = "0.12", default-features = false }
# codex display stack (vendored from codex-rs/tui)
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
textwrap = "0.16"
url = "2"
urlencoding = "2.1"
regex-lite = "0.1"
tracing = "0.1"

# misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
dirs = "5"
shellexpand = "3"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
