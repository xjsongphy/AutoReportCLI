name: Set up Rust
description: Install the stable Rust toolchain and restore the scoped Cargo cache.

inputs:
  cache-key:
    description: Shared Cargo cache key for this job or target.
    required: true
  components:
    description: Comma-separated Rust components to install.
    required: false
    default: ""
  target:
    description: Optional Rust target to install.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install stable Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    - name: Cache Cargo registry and build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        cache-on-failure: true

    - name: Install Rust target
      if: inputs.target != ''
      shell: bash
      run: rustup target add "${{ inputs.target }}"
