name: Linux sandbox

on:
  push:
  pull_request:

jobs:
  linux-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bubblewrap build dependencies
        # Host glibc libcap is used only by the native cargo test below.
        run: |
          sudo apt-get update && sudo apt-get install --yes \
            bubblewrap libcap-dev pkg-config
      - name: Install the Linux npm package target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Test the native helper and manager
        # Runs against the host glibc toolchain + apt libcap, before any musl
        # cross env vars are exported, so the native bwrap build is unaffected.
        run: cargo test -p autoreport-bwrap -p autoreport-linux-sandbox -p autoreport-sandboxing
      - name: Install Zig
        # zig cc provides a self-contained musl sysroot (with linux UAPI
        # headers) used as the C/C++ compiler for the musl payload, mirroring
        # openai/codex's rust-release workflow.
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - name: Install musl build tools
        # Vendored from openai/codex's install-musl-build-tools.sh: builds libcap
        # 2.75 from source with the musl toolchain (the apt libcap is glibc and
        # cannot link into musl) and exports CC/CFLAGS/PKG_CONFIG via GITHUB_ENV.
        # Runs after the native test so its generic CC/CFLAGS only affect the
        # musl cross build below.
        env:
          TARGET: x86_64-unknown-linux-musl
        run: bash .github/scripts/install-musl-build-tools.sh
      - name: Build native sandbox payload inputs
        run: |
          cargo build --release --target x86_64-unknown-linux-musl \
            -p autoreport-cli -p autoreport-linux-sandbox -p autoreport-bwrap
      - name: Stage Linux npm payload
        run: |
          mkdir -p .sandbox-payload/x86_64-unknown-linux-musl/bin
          cp target/x86_64-unknown-linux-musl/release/autoreport .sandbox-payload/x86_64-unknown-linux-musl/bin/
          cp target/x86_64-unknown-linux-musl/release/autoreport-linux-sandbox .sandbox-payload/x86_64-unknown-linux-musl/bin/
          cp target/x86_64-unknown-linux-musl/release/bwrap .sandbox-payload/x86_64-unknown-linux-musl/bin/
          python3 autoreport-cli/scripts/build_npm_package.py --package linux-x64 --vendor-src .sandbox-payload --force
      - name: Verify bundled sandbox payload
        run: |
          test -x dist/npm/linux-x64/vendor/x86_64-unknown-linux-musl/bin/autoreport-linux-sandbox
          test -x dist/npm/linux-x64/vendor/x86_64-unknown-linux-musl/autoreport-resources/bwrap
