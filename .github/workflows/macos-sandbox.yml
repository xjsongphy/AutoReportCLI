name: macOS sandbox

on:
  push:
  pull_request:

jobs:
  macos-sandbox:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native Seatbelt policy and exec integration
        run: |
          cargo test -p autoreport-sandboxing
          cargo test -p autoreport-tools --test isolation
      - name: Stage the host macOS npm package
        run: python3 autoreport-cli/scripts/build_npm_package.py --package host --force
      - name: Verify staged package layout
        run: |
          test -f dist/npm/$(python3 -c 'import platform; print("darwin-arm64" if platform.machine().lower() == "arm64" else "darwin-x64")')/vendor/$(rustc -vV | sed -n 's/^host: //p')/autoreport-package.json
