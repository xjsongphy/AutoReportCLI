# AutoReportCLI example configuration.
# Copy to `autoreport.config.yaml` in your project root and edit. API keys may
# also be supplied via environment variables (ANTHROPIC_API_KEY, OPENAI_API_KEY,
# DEEPSEEK_API_KEY, OPENROUTER_API_KEY). Env vars override empty YAML fields.

context_window: 128000

# API entries contain connection details only. Do not put model names here.
providers:
  anthropic:
    kind: anthropic
    # api_key: sk-ant-...      # or set ANTHROPIC_API_KEY
    temperature: 0.1
    max_tokens: 8192

  deepseek:
    kind: deepseek
    # api_key: ...             # or set DEEPSEEK_API_KEY
    api_base: https://api.deepseek.com/v1
    temperature: 0.1
    max_tokens: 8192

  openrouter:
    kind: openrouter
    # api_key: ...             # or set OPENROUTER_API_KEY
    api_base: https://openrouter.ai/api/v1

# Select an API first, then enter the model name. `sub` is shared by all four
# sub-agents for now.
models:
  main:
    provider: anthropic
    model: claude-sonnet-4-5-20251001
  sub:
    provider: deepseek
    model: deepseek-chat

# Per-agent runtime defaults.
agents:
  max_tool_iterations: 12
  compact_threshold: 0.8      # auto-compact when history exceeds this fraction of context_window
  temperature: 0.1
  max_tokens: 8192
  exec_timeout_secs: 120
