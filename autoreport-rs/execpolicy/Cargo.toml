[package]
name = "autoreport-execpolicy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Exec policy: prefix-based Starlark rules for command decisions (vendored from codex)."

[lib]
name = "autoreport_execpolicy"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
autoreport-utils-absolute-path = { path = "../utils/absolute-path" }
multimap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shlex = { workspace = true }
starlark = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
