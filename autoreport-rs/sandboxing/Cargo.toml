[package]
name = "autoreport-sandboxing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-platform command sandboxing for AutoReport"

[lib]
name = "autoreport_sandboxing"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
dunce.workspace = true
libc.workspace = true
regex-lite.workspace = true
serde_json.workspace = true
tracing.workspace = true
url.workspace = true
which.workspace = true
autoreport-codex-protocol = { workspace = true }
autoreport-network-proxy = { workspace = true }
autoreport-utils-absolute-path = { workspace = true }
autoreport-utils-path-uri = { workspace = true }
autoreport-utils-pty = { workspace = true }
autoreport-windows-sandbox = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
