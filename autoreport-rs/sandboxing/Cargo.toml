[package]
name = "autoreport-sandboxing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-platform command sandboxing for AutoReport"

[lib]
name = "autoreport_sandboxing"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
dirs.workspace = true
dunce.workspace = true
libc.workspace = true
regex-lite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
autoreport-protocol = { path = "../protocol" }
autoreport-utils-absolute-path = { path = "../utils/absolute-path" }
autoreport-utils-path-uri = { path = "../utils/path-uri" }
autoreport-network-proxy = { path = "../network-proxy" }

[target.'cfg(windows)'.dependencies]
autoreport-windows-sandbox = { path = "../windows-sandbox" }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
