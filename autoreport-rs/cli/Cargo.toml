[package]
name = "autoreport-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Codex-organized multi-agent CLI for physics experiment reports"

[[bin]]
name = "autoreport"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
env_logger.workspace = true
log.workspace = true
ratatui.workspace = true
tokio.workspace = true
autoreport-core = { path = "../core" }
autoreport-sandboxing = { path = "../sandboxing" }
autoreport-tui = { path = "../tui" }
autoreport-runtime = { path = "../runtime" }

[target.'cfg(windows)'.dependencies]
autoreport-windows-sandbox = { path = "../windows-sandbox" }
