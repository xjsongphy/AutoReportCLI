[package]
name = "autoreport-windows-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"
description = "Native Windows sandbox backend and helper executables for AutoReport"

[lib]
name = "autoreport_windows_sandbox"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "autoreport-windows-sandbox-setup"
path = "src/bin/setup_main/main.rs"

[[bin]]
name = "autoreport-command-runner"
path = "src/bin/command_runner/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
dunce.workspace = true
dirs-next = "2.0"
glob = "0.3"
rand = { version = "0.8", default-features = false, features = ["std", "small_rng"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["sync", "rt", "macros", "signal", "time"] }
tracing-appender = "0.2.3"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com", "Win32_System_Variant"] }
autoreport-otel = { workspace = true }
autoreport-codex-protocol = { workspace = true }
autoreport-utils-absolute-path = { workspace = true }
autoreport-utils-pty = { workspace = true }
autoreport-utils-string = { workspace = true }
# Keep the vendored Windows implementation's historical crate paths available
# while the package itself uses the AutoReport crate names.
codex_otel = { package = "autoreport-otel", path = "../otel" }
codex_utils_pty = { package = "autoreport-utils-pty", path = "../utils/pty" }
codex_utils_string = { package = "autoreport-utils-string", path = "../utils/string" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_Environment", "Win32_System_Pipes", "Win32_System_WindowsProgramming", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Kernel", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_NetManagement", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Networking_WinSock", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_Security_Cryptography", "Win32_Security_Authentication_Identity", "Win32_System_Rpc", "Win32_Graphics_Gdi", "Win32_System_StationsAndDesktops", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry"] }

[dev-dependencies]
pretty_assertions = "1"
