[package]
name = "autoreport-utils-pty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "autoreport_utils_pty"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow.workspace = true
portable-pty = "0.9"
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
filedescriptor = "0.8.3"
lazy_static = "1"
log.workspace = true
shared_library = "0.1.9"
winapi = { version = "0.3.9", features = ["handleapi", "jobapi2", "minwinbase", "processthreadsapi", "synchapi", "winbase", "wincon", "winerror", "winnt"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
pretty_assertions = "1"
