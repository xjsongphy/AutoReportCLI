[package]
name = "autoreport-config"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "autoreport_config"
path = "src/lib.rs"
doctest = false

[dependencies]
autoreport-execpolicy = { workspace = true }
autoreport-features = { workspace = true }
autoreport-file-system = { workspace = true }
autoreport-git-utils = { workspace = true }
autoreport-model-provider-info = { workspace = true }
autoreport-network-proxy = { workspace = true }
autoreport-codex-protocol = { workspace = true }
autoreport-utils-absolute-path = { workspace = true }
autoreport-utils-path = { workspace = true }
autoreport-utils-path-uri = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
dunce = { workspace = true }
dns-lookup = { workspace = true }
futures = { workspace = true, features = ["alloc", "std"] }
gethostname = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
multimap = { workspace = true }
prost = { workspace = true }
regex-lite = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_ignored = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
toml = { version = "0.9", features = ["preserve_order"] }
toml_edit = "0.24"
tonic = { workspace = true, features = ["router", "transport"] }
tonic-prost = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
wildmatch = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio-stream = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
winapi-util = "0.1.11"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
