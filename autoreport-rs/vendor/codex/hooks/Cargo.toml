[package]
name = "autoreport-hooks"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
name = "autoreport_hooks"
path = "src/lib.rs"
doctest = false
[dependencies]
autoreport-config = { workspace = true }
autoreport-plugin = { workspace = true }
autoreport-codex-protocol = { workspace = true }
autoreport-utils-absolute-path = { workspace = true }
autoreport-utils-output-truncation = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
futures = { workspace = true, features = ["alloc"] }
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
