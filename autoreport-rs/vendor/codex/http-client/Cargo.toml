[package]
name = "autoreport-http-client"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
name = "autoreport_http_client"
path = "src/lib.rs"
doctest = false
[dependencies]
autoreport-utils-rustls-provider = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
opentelemetry = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-native-roots", "stream"] }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
zstd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.31.0", features = ["trace"] }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = "0.3"
