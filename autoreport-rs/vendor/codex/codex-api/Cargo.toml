[package]
name = "autoreport-codex-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "autoreport_codex_api"
path = "src/lib.rs"
doctest = false

[dependencies]
autoreport-codex-client = { workspace = true }
autoreport-http-client = { workspace = true }
autoreport-codex-protocol = { workspace = true }
autoreport-utils-rustls-provider = { workspace = true }
autoreport-websocket-client = { workspace = true }
async-channel = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
regex-lite = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true, features = ["codec", "io"] }
tracing = { workspace = true }
tungstenite = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
