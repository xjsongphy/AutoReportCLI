[package]
name = "autoreport-models-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
name = "autoreport_models_manager"
path = "src/lib.rs"
doctest = false
[dependencies]
autoreport-collaboration-mode-templates = { workspace = true }
autoreport-http-client = { workspace = true }
autoreport-login = { workspace = true }
autoreport-otel = { workspace = true }
autoreport-codex-protocol = { workspace = true }
autoreport-utils-output-truncation = { workspace = true }
autoreport-utils-template = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
