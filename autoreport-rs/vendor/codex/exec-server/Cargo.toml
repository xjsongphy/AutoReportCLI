[package]
name = "autoreport-exec-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "autoreport_exec_server"
path = "src/lib.rs"
doctest = false

[dependencies]
autoreport-codex-api = { workspace = true }
autoreport-exec-server-protocol = { workspace = true }
autoreport-file-system = { workspace = true }
autoreport-http-client = { workspace = true }
autoreport-network-proxy = { workspace = true }
autoreport-otel = { workspace = true }
autoreport-codex-protocol = { workspace = true }
autoreport-sandboxing = { workspace = true }
autoreport-utils-absolute-path = { workspace = true }
autoreport-utils-path-uri = { workspace = true }
autoreport-utils-pty = { workspace = true }
autoreport-utils-rustls-provider = { workspace = true }
autoreport-websocket-client = { workspace = true }
arc-swap = { workspace = true }
libc = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio", "ws"] }
base64 = { workspace = true }
bytes = { workspace = true }
clatter = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
prost = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["io", "rt"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
