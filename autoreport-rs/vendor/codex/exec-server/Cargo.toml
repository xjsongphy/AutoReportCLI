[package]
name = "autoreport-exec-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "autoreport_exec_server"
path = "src/lib.rs"
doctest = false

[dependencies]
autoreport-codex-api = { workspace = true }
autoreport-exec-server-protocol = { workspace = true }
autoreport-file-system = { workspace = true }
autoreport-http-client = { workspace = true }
autoreport-network-proxy = { workspace = true }
autoreport-otel = { workspace = true }
autoreport-codex-protocol = { workspace = true }
autoreport-sandboxing = { workspace = true }
autoreport-utils-absolute-path = { workspace = true }
autoreport-utils-path-uri = { workspace = true }
autoreport-utils-pty = { workspace = true }
autoreport-utils-rustls-provider = { workspace = true }
autoreport-websocket-client = { workspace = true }
arc-swap = { workspace = true }
libc = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio", "ws"] }
base64 = { workspace = true }
bytes = { workspace = true }
clatter = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
prost = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["io", "rt"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
anyhow = { workspace = true }
ctor = { workspace = true }
http = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
pretty_assertions = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
test-case = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
