[package]
name = "autoreport-app-server-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "autoreport_app_server_protocol"
path = "src/lib.rs"
doctest = false

[dependencies]
autoreport-codex-protocol = { workspace = true }
autoreport-experimental-api-macros = { workspace = true }
autoreport-extension-items = { workspace = true }
autoreport-shell-command = { workspace = true }
autoreport-utils-absolute-path = { workspace = true }
autoreport-utils-path-uri = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
inventory = { workspace = true }
rmcp = { workspace = true, features = ["base64", "macros", "schemars", "server"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
autoreport-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
