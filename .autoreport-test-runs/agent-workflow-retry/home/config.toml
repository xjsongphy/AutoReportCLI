context_window = 128000

[providers.deepseek-e2e]
kind = "deepseek"
api_base = "http://127.0.0.1:18083/v1"
api_key = "e2e-placeholder"
temperature = 0.1
max_tokens = 1024

[models.main]
provider = "deepseek-e2e"
model = "deepseek-v4-flash"

[models.sub]
provider = "deepseek-e2e"
model = "deepseek-v4-flash"

[agents]
max_tool_iterations = 4
compact_threshold = 0.8
temperature = 0.1
max_tokens = 1024
exec_timeout_secs = 10
